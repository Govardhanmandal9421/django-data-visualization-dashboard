version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      - ./Data_V:/app/Data_V
      - ./Data_vi:/app/Data_vi
      - ./Templates:/app/Templates
      - ./public:/app/public
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=dataviz_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: